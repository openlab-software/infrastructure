---
# Prepara a máquina de controle (Ubuntu/Debian/WSL) para o Makefile: docker, kind, kubectl, helm e coleções.
# Usa só módulos nativos: as coleções ainda não existem quando este playbook é lido.
# Requer o ansible já instalado (sudo apt install -y ansible). Idempotente.
#
# Uso:
#   make bootstrap
- name: Preparar a máquina de controle
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    k8s_version: "1.33"
    kind_version: v0.29.0
  tasks:
    - name: Instalar pacotes do sistema
      become: true
      apt:
        name:
          - python3-pip
          - python3-kubernetes
          - curl
        state: present
        update_cache: true

    # Instalação no Python do sistema para o lookup do Bitwarden enxergar o módulo.
    # PIP_BREAK_SYSTEM_PACKAGES: o Ubuntu recente bloqueia pip no Python do sistema (PEP 668);
    # pips antigos ignoram a variável.
    - name: Instalar módulos Python (bitwarden-sdk)
      become: true
      pip:
        name: bitwarden-sdk
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: Instalar coleções do Ansible
      command: ansible-galaxy collection install -r requirements.yml
      args:
        chdir: "{{ playbook_dir }}/.."
      register: galaxy
      changed_when: "'Installing' in galaxy.stdout"

    - name: Verificar se o Helm já está instalado
      stat:
        path: /usr/local/bin/helm
      register: helm_bin

    # Só necessário para o argocd-local.yml
    - name: Instalar o Helm
      become: true
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: not helm_bin.stat.exists

    - name: Verificar se o kubectl já está instalado
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_bin

    - name: Instalar o kubectl (mesma minor do cluster)
      become: true
      get_url:
        url: "https://dl.k8s.io/release/{{ lookup('url', 'https://dl.k8s.io/release/stable-' ~ k8s_version ~ '.txt') }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      when: not kubectl_bin.stat.exists

    - name: Verificar se o kind já está instalado
      stat:
        path: /usr/local/bin/kind
      register: kind_bin

    # O kind precisa do Docker rodando. Se já houver um docker no PATH (Docker Desktop com
    # integração WSL, ou engine instalado à parte), não mexe.
    - name: Verificar se o Docker já está instalado
      command: sh -c 'command -v docker'
      register: docker_bin
      changed_when: false
      failed_when: false

    # docker.io = pacote da própria distro: dispensa repositório externo e funciona em
    # versões do Ubuntu que o repositório da Docker ainda não suporta.
    - name: Instalar o Docker
      become: true
      apt:
        name:
          - docker.io
          - docker-buildx
          - util-linux-extra
        state: present
      when: docker_bin.rc != 0

    - name: Iniciar o Docker
      become: true
      service:
        name: docker
        state: started
        enabled: true
      when: docker_bin.rc != 0

    # Com become o ansible_user vira root; o usuário real vem do ambiente (SUDO_USER se rodou via sudo)
    - name: Adicionar o usuário ao grupo docker
      become: true
      user:
        name: "{{ lookup('env', 'SUDO_USER') or lookup('env', 'USER') }}"
        groups: docker
        append: true
      when: docker_bin.rc != 0

    - name: Instalar o kind
      become: true
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: "0755"
      when: not kind_bin.stat.exists

    # Sem isso o kubelet do kind falha ("too many open files") quando há mais de um cluster
    - name: Aumentar o limite de inotify (kind)
      become: true
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kind.conf
        state: present
        reload: true
      loop:
        - { name: fs.inotify.max_user_instances, value: "512" }
        - { name: fs.inotify.max_user_watches, value: "524288" }
