---
# Mesmo setup do argocd.yml, mas executado na sua própria máquina (localhost),
# falando com o cluster pelo seu kubeconfig (~/.kube/config, ou $KUBECONFIG).
# Não usa o inventário nem SSH. Pré-requisitos locais (WSL/Linux):
#   - ansible, bws CLI, helm, kubectl com acesso ao cluster
#   - python3-kubernetes:  sudo apt install -y python3-kubernetes
#   - ansible-galaxy collection install -r requirements.yml
#
# Uso:
#   ansible-playbook -i localhost, argocd-local.yml
#   ansible-playbook -i localhost, argocd-local.yml -e argocd_cleanup=true
- name: Setup ArgoCD (GitOps) a partir da máquina local
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    argocd_install_prereqs: false
  environment:
    KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"
  vars_prompt:
    # Enter vazio usa BWS_ACCESS_TOKEN do ambiente, se estiver definido.
    - name: bitwarden_access_token
      prompt: "Access Token da Machine Account do Bitwarden"
      default: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"
      private: true
  roles:
    - argocd
