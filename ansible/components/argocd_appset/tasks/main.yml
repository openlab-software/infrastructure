---
# Só carrega as variáveis do role (github_user, UUID do PAT); o token em si não passa pelo Ansible
- name: Carregar variáveis de credenciais
  include_role:
    name: credentials
    public: true

# github-token-secret (generator scmProvider) e ghcr-helm-oci-creds, vindos do Bitwarden via ESO
- name: Criar ExternalSecrets com o GitHub PAT
  kubernetes.core.k8s:
    state: present
    template: github-externalsecrets.yml.j2

- name: Aguardar a sincronização dos ExternalSecrets
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: "{{ item }}"
    namespace: "{{ argocd_appset_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120
  loop: [github-token-secret, ghcr-helm-oci-creds]

# O template usa raw/endraw para não conflitar o Go template do ArgoCD com o Jinja
- name: Criar ApplicationSet de autodiscover da organização
  kubernetes.core.k8s:
    state: present
    template: applicationset.yml.j2
