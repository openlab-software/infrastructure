---
- name: Adicionar repositório Helm da Bitnami
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: Criar namespace {{ mongodb_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ mongodb_namespace }}"

# Root e usuário com a senha inicial; o keyfile do replica set só aceita caracteres base64,
# por isso usa o sha256 da senha
- name: Senhas do MongoDB (Bitwarden)
  include_role:
    name: credentials
    tasks_from: initial_password
  vars:
    initial_password_secret: mongodb-auth
    initial_password_namespace: "{{ mongodb_namespace }}"
    initial_password_data:
      mongodb-root-password: !unsafe "{{ .password }}"
      mongodb-passwords: !unsafe "{{ .password }}"
      mongodb-replica-set-key: !unsafe "{{ .password | sha256sum }}"

- name: Instalar/Atualizar MongoDB
  kubernetes.core.helm:
    name: mongodb
    chart_ref: bitnami/mongodb
    chart_version: "{{ mongodb_chart_version | default(omit, true) }}"
    release_namespace: "{{ mongodb_namespace }}"
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    values: "{{ lookup('template', 'values.yml.j2') | from_yaml }}"
