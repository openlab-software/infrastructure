---
- name: Validar senhas do MongoDB
  assert:
    that:
      - mongodb_root_password | length > 0
      - mongodb_password | length > 0
    fail_msg: Defina MONGODB_ROOT_PASSWORD e MONGODB_PASSWORD no ambiente (ou -e mongodb_root_password=... -e mongodb_password=...)
    quiet: true

- name: Adicionar repositório Helm da Bitnami
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: Instalar/Atualizar MongoDB
  kubernetes.core.helm:
    name: mongodb
    chart_ref: bitnami/mongodb
    chart_version: "{{ mongodb_chart_version | default(omit, true) }}"
    release_namespace: "{{ mongodb_namespace }}"
    create_namespace: true
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    values: "{{ lookup('template', 'values.yml.j2') | from_yaml }}"
