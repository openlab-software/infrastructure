---
# Só carrega as variáveis do role (github_user, UUID do PAT); o token em si não passa pelo Ansible
- name: Carregar variáveis de credenciais
  include_role:
    name: credentials
    public: true

# ghcr-creds (registry) e git-creds (write-back), vindos do Bitwarden via ESO
- name: Criar ExternalSecrets com o GitHub PAT
  kubernetes.core.k8s:
    state: present
    template: github-externalsecrets.yml.j2

- name: Aguardar a sincronização dos ExternalSecrets
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: "{{ item }}"
    namespace: "{{ argocd_image_updater_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120
  loop: [ghcr-creds, git-creds]

# Chart 0.x = configuração por annotations (a 1.x migrou para o CRD ImageUpdater)
- name: Instalar/Atualizar ArgoCD Image Updater
  kubernetes.core.helm:
    name: argocd-image-updater
    chart_ref: argo/argocd-image-updater
    chart_version: "<1.0.0"
    release_namespace: "{{ argocd_image_updater_namespace }}"
    wait: true
    wait_timeout: 5m
    values:
      config:
        applicationsAPIKind: kubernetes
        registries:
          - name: GitHub Container Registry
            prefix: ghcr.io
            api_url: https://ghcr.io
            credentials: "secret:{{ argocd_image_updater_namespace }}/ghcr-creds#creds"
