---
- name: Adicionar repositório Helm do prometheus-community
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Criar namespace {{ monitoring_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"

# Senha do Grafana vinda do Bitwarden (o chart lê o Secret grafana-admin via admin.existingSecret)
- name: Senha do admin do Grafana (Bitwarden)
  include_role:
    name: credentials
    tasks_from: initial_password
  vars:
    initial_password_secret: grafana-admin
    initial_password_namespace: "{{ monitoring_namespace }}"
    initial_password_data:
      admin-user: admin
      admin-password: !unsafe "{{ .password }}"

- name: Instalar/Atualizar kube-prometheus-stack
  kubernetes.core.helm:
    name: "{{ monitoring_release }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ monitoring_chart_version | default(omit, true) }}"
    release_namespace: "{{ monitoring_namespace }}"
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    values: >-
      {{ lookup('template', 'values.yml.j2') | from_yaml
         | combine(monitoring_extra_values, recursive=True) }}

# O sidecar do Grafana carrega ConfigMaps com o label grafana_dashboard (qualquer namespace).
# Aplicado com src (sem Jinja): o JSON usa {{service}} nas legendas e o Ansible converteria
# o JSON lido de um arquivo em objeto se ele passasse por uma expressão.
- name: Dashboard "Requisições (Tempo)"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ monitoring_namespace }}"
    src: "{{ role_path }}/files/dashboards/requests-tempo-configmap.yaml"
  when: "'tempo' in (selected_components | default([]))"

- name: Mostrar como acessar o Grafana
  debug:
    msg:
      - "Grafana: {{ 'http://' ~ grafana_host if grafana_ingress_enabled | bool else 'kubectl -n ' ~ monitoring_namespace ~ ' port-forward svc/' ~ monitoring_release ~ '-grafana 3000:80' }}"
      - "Usuário: admin"
      - "Senha: a senha inicial guardada no Bitwarden"
