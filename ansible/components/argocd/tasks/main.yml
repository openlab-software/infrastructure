---
- name: Limpar namespace antigo do ArgoCD
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: absent
    wait: true
    wait_timeout: 300
  when: argocd_cleanup | bool

- name: Adicionar repositório Helm do ArgoCD
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Instalar/Atualizar ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version | default(omit, true) }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    update_repo_cache: true
    wait: true
    wait_timeout: 5m
    values: >-
      {{ (_argocd_ingress_values if argocd_ingress_enabled | bool else {})
         | combine(argocd_extra_values, recursive=True) }}

# Senha do admin vinda do Bitwarden: o ESO grava o bcrypt no argocd-secret (criado pelo chart).
# OnChange: o htpasswd gera um salt novo a cada execução; sincronizar só quando o ExternalSecret
# muda evita reescrever o hash (e o passwordMtime, que derruba as sessões) a cada refresh.
- name: Senha do admin do ArgoCD (Bitwarden)
  include_role:
    name: credentials
    tasks_from: initial_password
  vars:
    initial_password_secret: argocd-secret
    initial_password_namespace: "{{ argocd_namespace }}"
    initial_password_creation_policy: Merge
    initial_password_refresh_policy: OnChange
    initial_password_data:
      admin.password: !unsafe '{{ htpasswd "admin" .password "bcrypt" | trimPrefix "admin:" }}'
      admin.passwordMtime: !unsafe '{{ now | dateInZone "2006-01-02T15:04:05Z" "UTC" }}'

# Só existe enquanto o admin.password não foi definido; agora ficaria com uma senha que não vale mais
- name: Remover argocd-initial-admin-secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"

- name: Mostrar como acessar o ArgoCD
  debug:
    msg:
      - "ArgoCD instalado!"
      - >-
        Acesso: {{
          'http://' ~ argocd_ingress_host
          if argocd_ingress_enabled | bool
          else 'kubectl port-forward svc/argocd-server -n ' ~ argocd_namespace ~ ' 8080:443  ->  https://localhost:8080'
        }}
      - "Usuário: admin"
      - "Senha: a senha inicial guardada no Bitwarden"
