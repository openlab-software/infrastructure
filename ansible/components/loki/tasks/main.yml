---
# O chart OSS do Loki (e do Tempo) mudou para o repositório grafana-community; grafana/* é só Enterprise/deprecated.
- name: Adicionar repositório Helm da Grafana (community)
  kubernetes.core.helm_repository:
    name: grafana-community
    repo_url: https://grafana-community.github.io/helm-charts

- name: Instalar/Atualizar Loki
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana-community/loki
    chart_version: "{{ loki_chart_version | default(omit, true) }}"
    release_namespace: "{{ observability_namespace }}"
    create_namespace: true
    update_repo_cache: true
    wait: true
    wait_timeout: 10m
    values: >-
      {{ lookup('template', 'values.yml.j2') | from_yaml
         | combine(loki_extra_values, recursive=True) }}
