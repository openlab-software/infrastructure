---
# Instala ArgoCD, Image Updater, External Secrets (Bitwarden) e o ApplicationSet.
# Roda no master1 (onde existe o kubeconfig do admin). Requer, na máquina de controle:
#   ansible-galaxy collection install -r requirements.yml
#   (rode antes: ansible-playbook -i localhost, bootstrap.yml --ask-become-pass)
#
# O único valor fornecido a cada execução é o access token do Bitwarden, pedido por prompt
# (ou via BWS_ACCESS_TOKEN no ambiente / -e bitwarden_access_token=...):
#   ansible-playbook -i inventory.ini argocd.yml
#   ansible-playbook -i inventory.ini argocd.yml -e argocd_cleanup=true   # recria o namespace do zero
#
# O PAT do GitHub é buscado no Bitwarden (secret id em roles/argocd/defaults/main.yml);
# org, usuário, tópico e UUIDs também vêm de roles/argocd/defaults/main.yml.
- name: Setup ArgoCD (GitOps)
  hosts: k8s-master
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    K8S_AUTH_KUBECONFIG: /etc/kubernetes/admin.conf
  vars_prompt:
    # Enter vazio usa BWS_ACCESS_TOKEN do ambiente, se estiver definido.
    # Passar -e bitwarden_access_token=... pula o prompt.
    - name: bitwarden_access_token
      prompt: "Access Token da Machine Account do Bitwarden"
      default: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"
      private: true
  roles:
    - argocd
