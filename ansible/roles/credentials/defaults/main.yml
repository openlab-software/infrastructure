---
# Nada aqui é secreto: pode ir para o Git. Segredos vêm do ambiente ou do Bitwarden.
bitwarden_access_token: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"
# PAT do GitHub (classic: repo + read:packages). Os componentes do ArgoCD não usam esta variável:
# o PAT chega ao cluster por ExternalSecrets (bitwarden_github_pat_secret_id). Ela só vale para quem
# pedir credentials_require_github; se GITHUB_TOKEN estiver no ambiente, o Bitwarden não é consultado.
github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
github_user: patrickdevbr            # dono do PAT (usado no GHCR e no git write-back)
# Frequência com que o ESO relê o PAT no Bitwarden (rotação chega sozinha ao cluster)
github_token_refresh_interval: 1h

# Senha inicial de tudo que é instalado com usuário admin (ArgoCD, Grafana, Harbor, MongoDB, Jenkins).
# Vira Secret no cluster via ExternalSecret (tasks/initial_password.yml); o Ansible não lê o valor.
bitwarden_initial_password_secret_id: 744291d6-7bba-4255-9a44-b4df00d9d819
initial_password_refresh_interval: 1h

# Bitwarden Secrets Manager
bitwarden_organization_id: "84371f8d-e8b3-4ce1-b115-b4db01129757"
bitwarden_project_id: "790fe7ba-b341-4753-8091-b4db0112aec1"
# UUID do secret que guarda o GitHub PAT. Fica num projeto separado do `erp`; a busca é por UUID,
# então só importa que a machine account tenha leitura nesse projeto também.
bitwarden_github_pat_secret_id: 417180c5-43da-4639-9268-b4db012ec063

# Quem inclui este role diz o que precisa (o token só é pedido quando necessário)
credentials_require_bitwarden: false
credentials_require_github: false
