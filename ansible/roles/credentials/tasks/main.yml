---
# Obtém, sob demanda e uma única vez por execução, o access token do Bitwarden e o GitHub PAT.
# Uso: include_role: { name: credentials, public: true } com credentials_require_* = true.
# O set_fact torna as próximas inclusões no-ops (as variáveis já estarão preenchidas).
- name: Pedir o access token do Bitwarden
  when:
    - bitwarden_access_token | length == 0
    - credentials_require_bitwarden | bool or (credentials_require_github | bool and github_token | length == 0)
  block:
    - name: Prompt do access token (ou exporte BWS_ACCESS_TOKEN)
      pause:
        prompt: "Access Token da Machine Account do Bitwarden"
        echo: false
      register: _bw_prompt

    - name: Guardar o token
      set_fact:
        bitwarden_access_token: "{{ _bw_prompt.user_input }}"
      no_log: true

- name: Buscar o GitHub PAT no Bitwarden
  set_fact:
    github_token: "{{ lookup('bitwarden.secrets.lookup', bitwarden_github_pat_secret_id, access_token=bitwarden_access_token) }}"
  when:
    - credentials_require_github | bool
    - github_token | length == 0
  no_log: true

- name: Validar credenciais pedidas
  assert:
    that:
      - not (credentials_require_bitwarden | bool) or bitwarden_access_token | length > 0
      - not (credentials_require_github | bool) or github_token | length > 0
    fail_msg: >-
      Faltam credenciais: informe BWS_ACCESS_TOKEN (Bitwarden) e/ou GITHUB_TOKEN no ambiente.
    quiet: true
  no_log: true
