---
# Cria um ExternalSecret com a senha inicial (bitwarden_initial_password_secret_id) e espera sincronizar.
# A senha não passa pelo Ansible: quem monta o Secret é o ESO, com o Go template de initial_password_data
# (marque os valores com !unsafe para o Jinja não tocar no {{ .password }}).
# Uso:
#   include_role: { name: credentials, tasks_from: initial_password }
#   vars:
#     initial_password_secret: grafana-admin
#     initial_password_namespace: monitoring
#     initial_password_data: { admin-user: admin, admin-password: !unsafe "{{ .password }}" }
#     initial_password_creation_policy: Merge     # opcional (padrão Owner)
#     initial_password_refresh_policy: OnChange   # opcional (padrão Periodic)
- name: Criar ExternalSecret {{ initial_password_secret }} (senha inicial do Bitwarden)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "{{ initial_password_secret }}"
        namespace: "{{ initial_password_namespace }}"
      spec:
        refreshInterval: "{{ initial_password_refresh_interval }}"
        refreshPolicy: "{{ initial_password_refresh_policy | default('Periodic') }}"
        secretStoreRef:
          kind: ClusterSecretStore
          name: bitwarden
        target:
          name: "{{ initial_password_secret }}"
          creationPolicy: "{{ initial_password_creation_policy | default('Owner') }}"
          template:
            engineVersion: v2
            data: "{{ initial_password_data }}"
        data:
          - secretKey: password
            remoteRef:
              key: "{{ bitwarden_initial_password_secret_id }}"

- name: Aguardar a sincronização de {{ initial_password_secret }}
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: "{{ initial_password_secret }}"
    namespace: "{{ initial_password_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120
