---
# External Secrets Operator + Bitwarden Secrets Manager.
# O bitwarden-sdk-server exige HTTPS, daí o cert-manager.
- name: Adicionar repositórios Helm (jetstack e external-secrets)
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: external-secrets, url: "https://charts.external-secrets.io" }

- name: Instalar cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: cert-manager
    create_namespace: true
    update_repo_cache: true
    wait: true
    wait_timeout: 5m
    values:
      crds:
        enabled: true

- name: Criar namespace do External Secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ external_secrets_namespace }}"

# Certificado self-signed consumido pelo bitwarden-sdk-server (secret bitwarden-tls-certs)
- name: Criar Issuer e Certificate do bitwarden-sdk-server
  kubernetes.core.k8s:
    state: present
    template: bitwarden-certificate.yml.j2

- name: Aguardar o Certificate ficar Ready
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    name: bitwarden-tls-certs
    namespace: "{{ external_secrets_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120

- name: Instalar External Secrets Operator
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    release_namespace: "{{ external_secrets_namespace }}"
    wait: true
    wait_timeout: 5m
    values:
      installCRDs: true
      bitwarden-sdk-server:
        enabled: true

# Único segredo de bootstrap: fica só no cluster, nunca no Git
- name: Criar secret bitwarden-access-token
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: bitwarden-access-token
        namespace: "{{ external_secrets_namespace }}"
      stringData:
        token: "{{ bitwarden_access_token }}"
  no_log: true

- name: Ler o certificado gerado
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: bitwarden-tls-certs
    namespace: "{{ external_secrets_namespace }}"
  register: bitwarden_tls
  no_log: true

# ca.crt pode vir vazio em self-signed; cai para tls.crt (já em base64)
- name: Definir CA bundle
  set_fact:
    bitwarden_ca_bundle: >-
      {{ bitwarden_tls.resources[0].data['ca.crt'] | default(bitwarden_tls.resources[0].data['tls.crt'], true) }}
  no_log: true

- name: Criar ClusterSecretStore bitwarden
  kubernetes.core.k8s:
    state: present
    template: bitwarden-clustersecretstore.yml.j2
