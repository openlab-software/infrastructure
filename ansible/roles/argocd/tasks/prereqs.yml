---
# Dependências para os módulos kubernetes.core (rodam no master1).
# Em execução local (argocd-local.yml) elas são instaladas à mão: argocd_install_prereqs=false.
- name: Instalar python3-kubernetes e curl
  apt:
    name:
      - python3-kubernetes
      - curl
    state: present
    update_cache: true
  when: argocd_install_prereqs | bool

- name: Verificar se o Helm já está instalado
  stat:
    path: /usr/local/bin/helm
  register: helm_bin
  when: argocd_install_prereqs | bool

- name: Instalar o Helm
  shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: argocd_install_prereqs | bool and not helm_bin.stat.exists

- name: Limpar namespace antigo do ArgoCD
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: absent
    wait: true
    wait_timeout: 300
  when: argocd_cleanup | bool
